name: fitpulse
description: "Premium Antrenman ve Yorgunluk Takip Uygulaması"
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9      # Kas haritası ve özel ikonlar için
  flutter_bloc: ^8.1.3     # Temiz mimari ve state yönetimi için
  equatable: ^2.0.5
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4

# Başlatıcı ikonları assets/icon/ altındaki logodan üretilir:
#   dart run flutter_launcher_icons
# assets/icon/ Flutter asset olarak BİLDİRİLMEZ; ikonlar derleme zamanında
# mipmap'lere yazılır, kaynak PNG'nin uygulama paketine girmesi gerekmez.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    # assets/icons/ bildirimi kaldırıldı: klasör hiç var olmadı ve kodda
    # kullanılmıyordu, ama Flutter bildirilen her klasörün diskte bulunmasını
    # istiyor ve bulamayınca build'i hata veriyordu.
    - assets/images/
    # Flutter asset klasörleri özyinelemeli değil; alt klasör ayrıca yazılmalı
    - assets/images/programs/

  # Poppins uygulamaya gömülü; internetten indirilmez (lisans: assets/fonts/OFL.txt)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
